name: Sync War Atlas (Firestore → repo)

# Battles added with the 新增戰役 button on war-atlas/ live in Firestore
# (war_atlas_battles / war_atlas_wars). This copies them into war-atlas/data/,
# rebuilds the generated files, and commits — so GitHub keeps the full record set.

on:
  schedule:
    - cron: '30 0 * * *'   # 00:30 UTC daily (08:30 台灣)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install firebase-admin
      - name: Write service account credentials
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/sa.json"
      - name: Pull Firestore → war-atlas/data and build
        run: python scripts/war_atlas_pull.py --credentials "$RUNNER_TEMP/sa.json"
      - name: Commit & push if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add war-atlas/data war-atlas/index.html
          git diff --staged --quiet && echo "No changes." || \
            git commit -m "chore: sync war atlas $(date -u +%Y-%m-%d)"
          git push
