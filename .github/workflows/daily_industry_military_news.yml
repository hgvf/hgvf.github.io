name: Sync daily news from notion to firestore (industry & military)

on:
  workflow_dispatch:

  # 如果之後要每天自動跑，例如台灣時間 11:30：
  schedule:
    - cron: "0 5 * * 1-5"   # UTC+8 13:00

jobs:
  sync:
    runs-on: ubuntu-latest

    env:
      NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      MILITARY_NOTION_PAGE_ID: ${{ vars.MILITARY_NOTION_PAGE_ID }}
      INDUSTRY_NOTION_PAGE_ID: ${{ vars.INDUSTRY_NOTION_PAGE_ID }}

    steps:
      # ------------------------------------------------------------
      # 1. Checkout repo
      # ------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ------------------------------------------------------------
      # 2. Python
      # ------------------------------------------------------------
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install requests google-auth

      # ------------------------------------------------------------
      # 3. 建立 Notion JSON fetch helper
      #
      #    空頁 / 找不到日期頁 / 內容不是合法 JSON ──→ 視為「當日無資料」：
      #    印出 WARNING、不寫出檔案、以 exit 0 結束，不讓整份 workflow 報錯。
      #    只有真正的失敗（Notion API 連線錯誤等）才會 exit 1 讓該步驟失敗。
      #    下游的 Validate / Publish 以「輸出檔是否存在且非空」判斷要不要跑，
      #    因此某一邊（軍武或產業）空資訊時，另一邊仍會照常發布。
      # ------------------------------------------------------------
      - name: Create Notion fetch helper
        run: |
          cat > /tmp/fetch_notion_json.py <<'PY'
          import argparse
          import json
          import os
          import re
          import sys
          import requests


          NOTION_VERSION = "2022-06-28"


          def headers(token):
              return {
                  "Authorization": f"Bearer {token}",
                  "Notion-Version": NOTION_VERSION,
                  "Content-Type": "application/json",
              }


          def skip(message, output):
              """
              Benign 'no data today' outcome. Print a warning, make sure no
              stale output file is left behind, and exit 0 so the overall
              workflow does NOT fail just because one page is empty.
              """
              print(f"WARNING: {message}")
              try:
                  if output and os.path.exists(output):
                      os.remove(output)
              except OSError:
                  pass
              print("No output written; downstream publish will be skipped.")
              sys.exit(0)


          def get_all_children(block_id, token):
              """
              Retrieve all child blocks with pagination.
              A Notion API / network error is a genuine failure (exit 1).
              """
              results = []
              cursor = None

              while True:
                  url = f"https://api.notion.com/v1/blocks/{block_id}/children?page_size=100"

                  if cursor:
                      url += f"&start_cursor={cursor}"

                  r = requests.get(
                      url,
                      headers=headers(token),
                      timeout=30,
                  )

                  if r.status_code >= 300:
                      print(
                          f"ERROR reading Notion block {block_id}: "
                          f"{r.status_code} {r.text}"
                      )
                      sys.exit(1)

                  data = r.json()
                  results.extend(data.get("results", []))

                  if not data.get("has_more"):
                      break

                  cursor = data.get("next_cursor")

              return results


          def find_latest_date_page(parent_page_id, token):
              """
              Find child_page whose title is YYYY-MM-DD.
              Return (latest_date, page_id), or (None, None) if there is none.
              """
              children = get_all_children(parent_page_id, token)

              candidates = []

              for block in children:
                  if block.get("type") != "child_page":
                      continue

                  title = (
                      block.get("child_page", {})
                      .get("title", "")
                      .strip()
                  )

                  if re.fullmatch(r"\d{4}-\d{2}-\d{2}", title):
                      candidates.append(
                          (title, block["id"])
                      )

              if not candidates:
                  return None, None

              candidates.sort(
                  key=lambda x: x[0],
                  reverse=True,
              )

              return candidates[0]


          def rich_text_to_text(items):
              return "".join(
                  item.get("plain_text", "")
                  for item in items or []
              )


          def extract_text(block, token):
              """
              Extract JSON text from common Notion block types.

              Supports:
              - code
              - paragraph
              - quote
              - callout
              - bulleted_list_item
              - numbered_list_item
              """
              block_type = block.get("type")
              obj = block.get(block_type, {})

              text = ""

              if isinstance(obj, dict):
                  text = rich_text_to_text(
                      obj.get("rich_text", [])
                  )

              pieces = []

              if text:
                  pieces.append(text)

              if block.get("has_children"):
                  for child in get_all_children(
                      block["id"],
                      token,
                  ):
                      child_text = extract_text(
                          child,
                          token,
                      )
                      if child_text:
                          pieces.append(child_text)

              return "\n".join(pieces)


          def clean_json_text(text):
              text = text.strip()

              # 防止 Notion 裡面存的是 markdown code fence
              text = re.sub(
                  r"^```(?:json)?\s*",
                  "",
                  text,
                  flags=re.IGNORECASE,
              )

              text = re.sub(
                  r"\s*```$",
                  "",
                  text,
              )

              return text.strip()


          def main():
              ap = argparse.ArgumentParser()
              ap.add_argument("--token", required=True)
              ap.add_argument("--page-id", required=True)
              ap.add_argument("--output", required=True)
              args = ap.parse_args()

              # Never let a previous run's file be mistaken for this run's data.
              try:
                  if os.path.exists(args.output):
                      os.remove(args.output)
              except OSError:
                  pass

              if not args.page_id:
                  skip(
                      "no Notion page id provided "
                      "(repository variable unset); skipping",
                      args.output,
                  )

              date, child_page_id = find_latest_date_page(
                  args.page_id,
                  args.token,
              )

              if not child_page_id:
                  skip(
                      "no YYYY-MM-DD child page found under Notion parent "
                      f"{args.page_id}; nothing to sync",
                      args.output,
                  )

              print(
                  f"Latest Notion page: {date} "
                  f"({child_page_id})"
              )

              blocks = get_all_children(
                  child_page_id,
                  args.token,
              )

              parts = []

              for block in blocks:
                  text = extract_text(
                      block,
                      args.token,
                  )

                  if text:
                      parts.append(text)

              raw = clean_json_text(
                  "\n".join(parts)
              )

              if not raw:
                  skip(
                      f"Notion page {date} contains no text "
                      "(treated as a no-data day)",
                      args.output,
                  )

              try:
                  payload = json.loads(raw)
              except json.JSONDecodeError as e:
                  print(f"Invalid JSON in Notion page {date}: {e}")
                  print("--- First 1000 chars ---")
                  print(raw[:1000])
                  skip(
                      f"Notion page {date} is not valid JSON; skipping so the "
                      "rest of the sync can continue",
                      args.output,
                  )

              with open(
                  args.output,
                  "w",
                  encoding="utf-8",
              ) as f:
                  json.dump(
                      payload,
                      f,
                      ensure_ascii=False,
                      indent=2,
                  )

              print(
                  f"Saved valid JSON to {args.output}"
              )


          if __name__ == "__main__":
              main()
          PY

      # ============================================================
      # MILITARY NEWS
      # ============================================================

      - name: Fetch latest Military News from Notion
        run: |
          python /tmp/fetch_notion_json.py \
            --token "$NOTION_API_KEY" \
            --page-id "$MILITARY_NOTION_PAGE_ID" \
            --output /tmp/military_news.json

      - name: Validate & Publish Military News to Firestore
        run: |
          if [ -s /tmp/military_news.json ]; then
            python -m json.tool /tmp/military_news.json > /dev/null
            python scripts/publish.py \
              --type military \
              --file /tmp/military_news.json
          else
            echo "No Military data (empty / missing page) — skipping publish."
          fi

      # ============================================================
      # INDUSTRY NEWS
      #
      # 以 `if: ${{ !cancelled() }}` 讓產業消息不受軍武步驟是否失敗影響：
      # 即使軍武那邊發生真正的錯誤，產業消息仍會照常嘗試同步。
      # ============================================================

      - name: Fetch latest Industry News from Notion
        if: ${{ !cancelled() }}
        run: |
          python /tmp/fetch_notion_json.py \
            --token "$NOTION_API_KEY" \
            --page-id "$INDUSTRY_NOTION_PAGE_ID" \
            --output /tmp/industry_news.json

      - name: Validate & Publish Industry News to Firestore
        if: ${{ !cancelled() }}
        run: |
          if [ -s /tmp/industry_news.json ]; then
            python -m json.tool /tmp/industry_news.json > /dev/null
            python scripts/publish.py \
              --type industry \
              --file /tmp/industry_news.json
          else
            echo "No Industry data (empty / missing page) — skipping publish."
          fi
