name: Rebuild lookup indexes

# Rebuilds the single-doc lookup indexes the site reads instead of scanning
# whole collections on every page load (a major Firestore-read-quota drain):
#   · indexes/ticker_events    — watchlist ticker → latest supply/industry/
#                                earnings record
#   · indexes/mil_defense_daily — 每日軍武合約 page's newest events
#
# Both are updated incrementally whenever scripts/publish.py runs (news /
# earnings / events / defense). This scheduled full rebuild is a safety net: it
# backfills anything a missed publish skipped and prunes entries for docs that
# were deleted (the incremental merge only ever adds/updates).
#
# Schedule: 23:59 UTC Sun–Thu = 07:59 Taiwan time (UTC+8) Mon–Fri, just before
# the morning news scheduling jobs finish (~08:00 TW). Adjust the cron if those
# jobs move.
#
# Required repo secret (Settings → Secrets and variables → Actions):
#   FIREBASE_SERVICE_ACCOUNT — the service-account JSON (same secret the other
#                              Firestore workflows use).

on:
  schedule:
    - cron: '59 23 * * 0-4'   # 07:59 Taiwan (UTC+8) Mon–Fri
  workflow_dispatch:          # allow a manual one-click rebuild from the Actions tab

permissions:
  contents: read

jobs:
  reindex:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install google-auth requests
      - name: Write service account credentials
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/sa.json"
      - name: Rebuild lookup indexes
        run: python scripts/publish.py --type reindex --credentials "$RUNNER_TEMP/sa.json"
