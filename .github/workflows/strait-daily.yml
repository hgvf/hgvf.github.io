name: strait-daily

# 每日抓取國防部即時軍事動態 → 更新 mil/data/strait.json（有 diff 才 commit）。
# cron 30 0 * * *（UTC）= 台北 08:30。可手動觸發並回補天數。
on:
  schedule:
    - cron: "30 0 * * *"
  workflow_dispatch:
    inputs:
      pages:
        description: "回補頁數（保留給未來分頁抓取）"
        required: false
        default: "1"

permissions:
  contents: write

concurrency:
  group: strait-daily
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Self-test parser (offline)
        run: python3 mil/scripts/scrape_mnd.py --self-test

      - name: Integrity check
        run: python3 mil/scripts/check_integrity.py

      - name: Scrape MND (best-effort; data-center IP may be blocked)
        run: python3 mil/scripts/scrape_mnd.py || echo "scrape returned non-zero; continuing"

      - name: Commit if changed
        run: |
          if [[ -n "$(git status --porcelain mil/data/strait.json)" ]]; then
            git config user.name  "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add mil/data/strait.json
            git commit -m "chore: strait daily update $(date -u +%Y-%m-%d)"
            git push
          else
            echo "no changes"
          fi
