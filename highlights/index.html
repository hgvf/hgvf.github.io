<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>重點新聞 · Highlight Watchlist</title>
  <link rel="stylesheet" href="../css/style.css?v=20260824b" />
  <link rel="stylesheet" href="../css/reports.css?v=20260824b" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Sans+TC:wght@300;400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
</head>
<body>
  <div id="siteSidebar"></div>

  <main class="main-content">
    <div class="rp-head hl-head">
      <h2 class="page-title">重點新聞 · Highlight Watchlist</h2>
    </div>

    <div class="hl-legend">
      <span class="hl-legend-item"><span class="hl-dot hl-src-supply-chain"></span>供應鏈瓶頸</span>
      <span class="hl-legend-item"><span class="hl-dot hl-src-industry-news"></span>產業消息</span>
    </div>

    <div id="highlightRoot" class="hl-root hl-root-page"></div>
  </main>

  <script type="module">
    import { mountSidebar } from "../js/sidebar.js";
    import { mountHighlight } from "../js/highlight.js";
    import { detail as scDetail } from "../js/scdetail.js";
    import { detail as industryDetail } from "../js/industrydetail.js";

    mountSidebar("highlights");

    // Dispatch to the right card renderer based on where the item was collected.
    function renderDetail(item) {
      return (item && item._source === "industry-news") ? industryDetail(item) : scDetail(item);
    }

    mountHighlight({
      root: document.getElementById("highlightRoot"),
      renderDetail,
    });
  </script>
</body>
</html>
