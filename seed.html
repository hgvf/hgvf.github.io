<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <title>Firestore Seeder</title>
  <style>
    body { font-family: monospace; background: #111; color: #eee; padding: 2rem; }
    button { padding: 0.6rem 1.4rem; background: #4f8ef7; color: #fff; border: none; border-radius: 6px; cursor: pointer; font-size: 1rem; margin-right: 0.6rem; margin-bottom: 0.6rem; }
    button.prices { background: #2fae62; }
    button.cleanup { background: #d9534f; }
    button.reindex { background: #8e6fd8; }
    button:disabled { background: #555; cursor: default; }
    #log { margin-top: 1.5rem; white-space: pre-wrap; line-height: 1.6; }
    .ok  { color: #6f6; }
    .err { color: #f66; }
  </style>
</head>
<body>
  <h2>Firestore Seeder</h2>
  <p>必須先登入 Google（在主站登入後再開此頁），點下方按鈕將冷資料寫入 Firestore。</p>
  <button id="btnWatchlist">Seed Watchlist（data/watchlist.json）</button>
  <button id="btnPrices" class="prices">Seed Prices（data/prices.json）</button>
  <button id="btnCleanup" class="cleanup">Cleanup Zombies（清除孤兒資料）</button>
  <button id="btnReindex" class="reindex">Rebuild Event Index（重建 ticker 事件索引）</button>
  <button id="btnReindexDefense" class="reindex">Rebuild Defense Index（重建每日軍武索引）</button>
  <div id="log"></div>

  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
    import { getAuth, GoogleAuthProvider, signInWithPopup } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';
    import { getFirestore, doc, setDoc, getDocs, deleteDoc, collection, query, where } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';

    const firebaseConfig = {
      apiKey:            "AIzaSyDT4eEQZXnqTBn17LGrg9isYFRFFNCbI-I",
      authDomain:        "watchlist-7fd99.firebaseapp.com",
      projectId:         "watchlist-7fd99",
      storageBucket:     "watchlist-7fd99.firebasestorage.app",
      messagingSenderId: "1074341286002",
      appId:             "1:1074341286002:web:bda4e06fc474b4789072eb",
    };

    const app  = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db   = getFirestore(app);

    const log = document.getElementById('log');
    function print(msg, cls) {
      const s = document.createElement('span');
      s.className = cls || '';
      s.textContent = msg + '\n';
      log.appendChild(s);
    }

    async function ensureSignedIn() {
      if (auth.currentUser) {
        print('已登入: ' + auth.currentUser.email, 'ok');
        return true;
      }
      try {
        print('正在登入...');
        await signInWithPopup(auth, new GoogleAuthProvider());
        print('登入成功: ' + auth.currentUser.email, 'ok');
        return true;
      } catch (e) {
        print('登入失敗: ' + e.message, 'err');
        return false;
      }
    }

    /* ── Seed watchlist ────────────────────────────── */
    document.getElementById('btnWatchlist').addEventListener('click', async () => {
      const btn = document.getElementById('btnWatchlist');
      btn.disabled = true;
      log.innerHTML = '';
      if (!(await ensureSignedIn())) { btn.disabled = false; return; }

      try {
        const res = await fetch('data/watchlist.json?t=' + Date.now());
        const WATCHLIST = await res.json();

        for (let si = 0; si < WATCHLIST.sectors.length; si++) {
          const sector = WATCHLIST.sectors[si];
          const sectorId = sector.id;
          print(`\n[Sector] ${sector.name}`);
          await setDoc(doc(db, 'sectors', sectorId), {
            name: sector.name,
            ticker_overview: sector.ticker_overview || [],
            order: sector.order ?? si,
          }, { merge: true });
          print(`  sectors/${sectorId} ✓`, 'ok');

          for (let ui = 0; ui < (sector.subsectors || []).length; ui++) {
            const sub = sector.subsectors[ui];
            const subId = sub.id;
            print(`  [Subsector] ${sub.name}`);
            await setDoc(doc(db, 'subsectors', subId), {
              sector_id: sectorId,
              name: sub.name,
              notes: sub.notes || '',
              order: sub.order ?? ui,
            }, { merge: true });
            print(`    subsectors/${subId} ✓`, 'ok');

            // Delete ALL existing ticker docs for this subsector (cleans up stale IDs)
            const oldTickers = await getDocs(query(collection(db, 'tickers'), where('subsector_id', '==', subId)));
            for (const d of oldTickers.docs) await deleteDoc(d.ref);
            if (oldTickers.size) print(`    🗑 deleted ${oldTickers.size} stale tickers for ${sub.name}`, '');

            for (let ti = 0; ti < (sub.tickers || []).length; ti++) {
              const t = sub.tickers[ti];
              // Composite key: same symbol can exist in multiple subsectors without conflict
              const tickerId = `${subId}_${t.symbol}`;
              await setDoc(doc(db, 'tickers', tickerId), {
                subsector_id: subId,
                sector_id: sectorId,
                symbol: t.symbol,
                name: t.name || '',
                market: t.market || 'US',
                order: t.order ?? ti,
              });
              print(`      ticker ${t.symbol} ✓`, 'ok');
            }

            for (let ai = 0; ai < (sub.analysis || []).length; ai++) {
              const a = sub.analysis[ai];
              const rowsFlat = (a.rows || []).map(row =>
                typeof row === 'string' ? row : JSON.stringify(row)
              );
              await setDoc(doc(db, 'analysis', a.id), {
                subsector_id: subId,
                sector_id: sectorId,
                title: a.title || '',
                columns: a.columns || [],
                rows: rowsFlat,
                order: a.order ?? ai,
              }, { merge: true });
              print(`      analysis "${a.title}" ✓`, 'ok');
            }

            for (let ri = 0; ri < (sub.research_notes || []).length; ri++) {
              const r = sub.research_notes[ri];
              await setDoc(doc(db, 'research_notes', r.id), {
                subsector_id: subId,
                sector_id: sectorId,
                title: r.title || '',
                content: r.content || '',
                order: r.order ?? ri,
              }, { merge: true });
              print(`      research_note "${r.title}" ✓`, 'ok');
            }
          }
        }
        print('\nWatchlist 完成！請重新整理主站。', 'ok');
      } catch (e) {
        print('錯誤: ' + e.message, 'err');
      }
      btn.disabled = false;
    });

    /* ── Cleanup orphaned (zombie) docs ─────────────────
       Removes docs whose parent no longer exists:
         · subsectors      → sector_id points to a missing sector
         · tickers         → subsector_id points to a missing subsector
         · analysis        → subsector_id points to a missing subsector
         · research_notes  → subsector_id points to a missing subsector
       These accumulate when a sector/subsector was deleted before cascade
       delete existed. Safe to run repeatedly. */
    document.getElementById('btnCleanup').addEventListener('click', async () => {
      const btn = document.getElementById('btnCleanup');
      btn.disabled = true;
      log.innerHTML = '';
      if (!(await ensureSignedIn())) { btn.disabled = false; return; }

      try {
        const idsOf = async (coll) => {
          const snap = await getDocs(collection(db, coll));
          return new Set(snap.docs.map(d => d.id));
        };
        const sectorIds = await idsOf('sectors');

        // 1) subsectors whose sector_id is gone.
        const subSnap = await getDocs(collection(db, 'subsectors'));
        const liveSubIds = new Set();
        const orphanSubs = [];
        subSnap.docs.forEach(d => {
          if (sectorIds.has(d.data().sector_id)) liveSubIds.add(d.id);
          else orphanSubs.push(d);
        });
        print(`subsectors: ${subSnap.size} total, ${orphanSubs.length} orphaned`);
        for (const d of orphanSubs) {
          await deleteDoc(d.ref);
          print(`  🗑 subsector ${d.id} — ${d.data().name || ''}`, 'ok');
        }

        // 2) children whose subsector_id is not a surviving subsector.
        for (const coll of ['tickers', 'analysis', 'research_notes']) {
          const snap = await getDocs(collection(db, coll));
          let n = 0;
          for (const d of snap.docs) {
            if (!liveSubIds.has(d.data().subsector_id)) {
              await deleteDoc(d.ref);
              n++;
            }
          }
          print(`${coll}: ${snap.size} total, deleted ${n} orphaned`, n ? 'ok' : '');
        }

        print('\nCleanup 完成！請重新整理主站。', 'ok');
      } catch (e) {
        print('錯誤: ' + e.message, 'err');
      }
      btn.disabled = false;
    });

    /* ── Rebuild ticker → latest-event index ─────────────
       Same result as `python scripts/publish.py --type reindex`, but from the
       browser. Scans the three report collections once and writes a single
       indexes/ticker_events doc that the watchlist reads to tag cards — so the
       site stops scanning those whole collections on every page load. Run this
       once after deploying, and any time you want to re-sync (e.g. after
       deleting reports). Costs a one-time full read of the three collections. */
    document.getElementById('btnReindex').addEventListener('click', async () => {
      const btn = document.getElementById('btnReindex');
      btn.disabled = true;
      log.innerHTML = '';
      if (!(await ensureSignedIn())) { btn.disabled = false; return; }

      try {
        const map = {};
        // mark(symbol, kind, id, date) — keep the newest date per (symbol,kind).
        const mark = (sym, kind, id, date) => {
          const s = String(sym || '').trim();
          if (!s || !id) return;
          const entry = (map[s] = map[s] || {});
          const cur = entry[kind];
          if (!cur || String(date || '') > String(cur.date || '')) {
            entry[kind] = { id, date: String(date || '') };
          }
        };
        const scan = async (name, kind, tickersOf, dateOf) => {
          const snap = await getDocs(collection(db, name));
          let n = 0;
          snap.docs.forEach(d => {
            const data = d.data();
            tickersOf(data).forEach(sym => { mark(sym, kind, d.id, dateOf(data)); n++; });
          });
          print(`  ${name}: ${snap.size} docs`, 'ok');
        };

        print('掃描報導 collection...');
        await scan('supply_chain_news',   'supply',   d => d.tickers || [],              d => d.date);
        await scan('supply_chain_events', 'industry', d => d.tickers || [],              d => d.event_date || d.date);
        await scan('earnings_calls',      'earnings', d => (d.ticker ? [d.ticker] : []), d => d.date);

        await setDoc(doc(db, 'indexes', 'ticker_events'), {
          map,
          updated_at: new Date().toISOString(),
        });
        print(`\n寫入 indexes/ticker_events：${Object.keys(map).length} 檔 symbol ✓`, 'ok');
        print('完成！主站現在只讀這 1 份文件即可顯示 供/產/法 標籤。', 'ok');
      } catch (e) {
        print('錯誤: ' + e.message, 'err');
      }
      btn.disabled = false;
    });

    /* ── Rebuild every-day military → single-doc index ───
       Same result as `python scripts/publish.py --type defense/reindex`, but
       from the browser. Scans mil_defense_daily once and writes a single
       indexes/mil_defense_daily doc (newest 250 events) that the 每日軍武合約
       page reads — so the site stops scanning the whole collection on every
       page load. Run once after deploying, or any time to re-sync after
       deleting events. Costs a one-time full read of mil_defense_daily. */
    document.getElementById('btnReindexDefense').addEventListener('click', async () => {
      const btn = document.getElementById('btnReindexDefense');
      btn.disabled = true;
      log.innerHTML = '';
      if (!(await ensureSignedIn())) { btn.disabled = false; return; }

      try {
        print('掃描 mil_defense_daily...');
        const snap = await getDocs(collection(db, 'mil_defense_daily'));
        const rows = snap.docs.map(d => {
          const x = d.data();
          return { id: d.id, _date: x._date || '', _country: x._country || '', _type: x._type || '', _score: x._score || 0, data: x.data || {} };
        });
        rows.sort((a, b) => String(b._date || '').localeCompare(String(a._date || '')));
        const events = rows.slice(0, 250);
        await setDoc(doc(db, 'indexes', 'mil_defense_daily'), {
          updated_at: new Date().toISOString(),
          count: events.length,
          events,
        });
        print(`\n寫入 indexes/mil_defense_daily：${events.length} 筆事件 ✓`, 'ok');
        print('完成！每日軍武合約頁現在只讀這 1 份文件即可呈現。', 'ok');
      } catch (e) {
        print('錯誤: ' + e.message, 'err');
      }
      btn.disabled = false;
    });

    /* ── Seed prices ──────────────────────────────── */
    document.getElementById('btnPrices').addEventListener('click', async () => {
      const btn = document.getElementById('btnPrices');
      btn.disabled = true;
      log.innerHTML = '';
      if (!(await ensureSignedIn())) { btn.disabled = false; return; }

      try {
        const res = await fetch('data/prices.json?t=' + Date.now());
        const data = await res.json();
        const prices = data.prices || {};
        const symbols = Object.keys(prices);
        print(`\n讀到 ${symbols.length} 檔報價`);

        for (const sym of symbols) {
          await setDoc(doc(db, 'prices', sym), prices[sym]);
          print(`  prices/${sym} ✓`, 'ok');
        }
        print('\nPrices 完成！請重新整理主站。', 'ok');
      } catch (e) {
        print('錯誤: ' + e.message, 'err');
      }
      btn.disabled = false;
    });
  </script>
</body>
</html>
