<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>財報電話會議分析 · Earnings Calls</title>
  <link rel="stylesheet" href="../css/style.css?v=20260806e" />
  <link rel="stylesheet" href="../css/reports.css?v=20260814b" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Sans+TC:wght@300;400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
</head>
<body>
  <div id="siteSidebar"></div>

  <main class="main-content">
    <div class="rp-head">
      <h2 class="page-title">財報電話會議分析</h2>
      <a class="rp-skill-link" href="https://github.com/hgvf/Skills-zoo/blob/main/Earnings-call" target="_blank" rel="noopener" title="查看產生此頁 JSON 的 LLM Skill">
        <svg viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8Z"/></svg>
        <span>Skill</span>
      </a>
    </div>
    <div class="ar-sources">
      <span class="ar-sources-label">財報行事曆</span>
      <a class="ar-src" href="https://finmoconf.diveinvest.net/" target="_blank" rel="noopener">
        <span class="ar-src-mk">台股</span><span class="ar-src-nm">FinMo</span></a>
      <a class="ar-src" href="https://earningshub.com/earnings-list/this-week" target="_blank" rel="noopener">
        <span class="ar-src-mk">美股</span><span class="ar-src-nm">EarningsHub</span></a>
      <a class="ar-src" href="https://tradingeconomics.com/japan/earnings" target="_blank" rel="noopener">
        <span class="ar-src-mk">日股</span><span class="ar-src-nm">TradingEconomics</span></a>
      <a class="ar-src" href="https://tradingeconomics.com/south-korea/earnings" target="_blank" rel="noopener">
        <span class="ar-src-mk">韓股</span><span class="ar-src-nm">TradingEconomics</span></a>
    </div>

    <!-- Admin-only importer (visible only when signed in as a whitelisted user) -->
    <details class="rp-import" id="importPanel" hidden>
      <summary>＋ 匯入 / 更新財報 JSON</summary>
      <p class="rp-hint">貼上 claude.ai Project 產生的 JSON —— 接受 <code>{"calls":[...]}</code>、陣列、或單一 call 物件。發布後自動刷新，資料存於 Firebase。</p>
      <textarea id="jsonInput" class="rp-textarea" spellcheck="false"
        placeholder='{"calls":[{"ticker":"NVDA","company":"NVIDIA Corp","year":2026,"quarter":"Q2","date":"2026-05-28","summary":"...","highlights":[{"text":"...","sentiment":"bullish"}]}]}'></textarea>
      <div class="rp-import-actions">
        <button id="publishBtn" class="rp-btn">發布到 Firebase</button>
        <span id="pubStatus" class="rp-status"></span>
      </div>
    </details>

    <div id="reportRoot" class="rv-root"></div>

    <!-- Single-company last-4-quarters comparison -->
    <section class="ec-compare" id="compare" hidden>
      <div class="ec-compare-head">
        <h3 class="ec-compare-title">近四季比較</h3>
        <label class="rv-ctl">公司 <span class="rv-sel-wrap"><select class="rv-select" id="cmpTicker"></select></span></label>
      </div>
      <div class="ec-compare-row" id="compareRow"></div>
    </section>

  </main>

  <script type="module">
    import { mountSidebar } from "../js/sidebar.js";
    import { mountReportView } from "../js/reportview.js";
    import { sent, esc, fmtDate, chartUrl, onAuth, parseCalls, saveEarnings } from "../js/reports.js";

    mountSidebar("earnings");

    // Overall = bullish only if bullish count exceeds bearish + neutral combined
    // (and symmetrically for bearish); otherwise neutral.
    function overall(c) {
      let b = 0, r = 0, n = 0;
      (c.highlights || []).forEach(h => {
        if (h.sentiment === "bullish") b++;
        else if (h.sentiment === "bearish") r++;
        else n++;
      });
      if (b > r + n) return "bullish";
      if (r > b + n) return "bearish";
      return "neutral";
    }
    function hlHTML(h) {
      const hs = sent(h.sentiment);
      const icon = h.sentiment === "bullish" ? "▲" : h.sentiment === "bearish" ? "▼" : "—";
      return `<div class="ec-hl ${hs.cls}"><span class="sent-tag ${hs.cls}">${icon}</span><span>${esc(h.text)}</span></div>`;
    }
    function detail(c) {
      const s = sent(overall(c));
      const hls = (c.highlights || []).map(hlHTML).join("");
      const watch = (c.watch || []).filter(w => w);
      const watchCard = watch.length
        ? `<div class="rp-subcard ec-watch"><div class="rp-subcard-head">🔮 未來重點看點</div>
            <ul class="ec-watch-list">${watch.map(w => `<li>${esc(w)}</li>`).join("")}</ul></div>`
        : "";
      return `<article class="rv-detail ${s.cls}">
        <div class="ec-head">
          <span class="ec-ticker">${esc(c.ticker)}</span>
          <span class="ec-company">${esc(c.company || "")}</span>
          <a class="ec-kbtn" href="${esc(chartUrl(c.ticker))}" target="_blank" rel="noopener" title="在 TradingView 看 ${esc(c.ticker)} 線圖">📈 K線</a>
          <span class="ec-qtr">${esc(c.year)} ${esc(c.quarter)}${c.date ? " · " + esc(fmtDate(c.date)) : ""}</span>
        </div>
        ${c.summary ? `<p class="ec-summary">${esc(c.summary)}</p>` : ""}
        ${hls ? `<div class="ec-hls">${hls}</div>` : ""}
        ${watchCard}
      </article>`;
    }

    // ── Last-4-quarters comparison section ──────────────────────────────
    const compareSec = document.getElementById("compare");
    const cmpSel = document.getElementById("cmpTicker");
    const cmpRow = document.getElementById("compareRow");
    let cmpAll = [], cmpTicker = null;

    function cmpCard(c) {
      const s = sent(overall(c));
      const hls = (c.highlights || []).map(hlHTML).join("");
      const watch = (c.watch || []).filter(w => w);
      const watchCard = watch.length
        ? `<div class="ec-cmp-watch"><div class="ec-cmp-watch-h">🔮 未來看點</div><ul class="ec-watch-list">${watch.map(w => `<li>${esc(w)}</li>`).join("")}</ul></div>`
        : "";
      return `<div class="ec-cmp-card ${s.cls}">
        <div class="ec-cmp-top">
          <span class="ec-cmp-fy">${esc(c.year)} ${esc(c.quarter)}</span>
          <span class="ec-cmp-date">${c.date ? esc(fmtDate(c.date)) : ""}</span>
        </div>
        ${c.summary ? `<p class="ec-cmp-summary">${esc(c.summary)}</p>` : ""}
        ${hls ? `<div class="ec-hls">${hls}</div>` : ""}
        ${watchCard}
      </div>`;
    }

    function renderCompare() {
      if (!cmpTicker) { cmpRow.innerHTML = ""; return; }
      const calls = cmpAll.filter(c => c.ticker === cmpTicker)
        .sort((a, b) => String(a.date || "").localeCompare(String(b.date || "")));
      const last4 = calls.slice(-4); // most recent 4, chronological (old → new)
      if (!last4.length) { cmpRow.innerHTML = `<div class="rv-empty">此公司尚無會議紀錄。</div>`; return; }
      cmpRow.innerHTML = last4.map(cmpCard).join('<div class="ec-cmp-arrow">→</div>');
    }

    function onEarningsData(calls) {
      cmpAll = calls;
      const tickers = [...new Set(calls.map(c => c.ticker).filter(Boolean))].sort();
      compareSec.hidden = tickers.length === 0;
      if (!tickers.includes(cmpTicker)) cmpTicker = tickers[0] || null;
      cmpSel.innerHTML = tickers.map(t => `<option value="${esc(t)}">${esc(t)}</option>`).join("");
      if (cmpTicker) cmpSel.value = cmpTicker;
      renderCompare();
    }
    cmpSel.addEventListener("change", () => { cmpTicker = cmpSel.value; renderCompare(); });

    let view;
    mountReportView({
      root: document.getElementById("reportRoot"),
      collection: "earnings_calls",
      tickersOf: c => (c.ticker ? [c.ticker] : []),
      sentimentOf: overall,
      nodeTitle: c => `${c.ticker} ${c.year} ${c.quarter}`,
      chipLabel: c => c.ticker,
      renderDetail: detail,
      emptyHint: "點選左側會議節點，重點會顯示在這裡",
      onData: onEarningsData,
    }).then(v => { view = v; view.setAdmin(lastAdmin); }).catch(e => { console.error(e); });

    // Admin importer + delete (sign-in handled in the sidebar)
    const importPanel = document.getElementById("importPanel");
    const pubStatus = document.getElementById("pubStatus");
    let lastAdmin = false;
    onAuth(({ isAdmin }) => { lastAdmin = isAdmin; importPanel.hidden = !isAdmin; if (view) view.setAdmin(isAdmin); });

    document.getElementById("publishBtn").addEventListener("click", async () => {
      const raw = document.getElementById("jsonInput").value.trim();
      pubStatus.className = "rp-status";
      if (!raw) { pubStatus.textContent = "請先貼上 JSON。"; return; }
      let calls;
      try { calls = parseCalls(raw); }
      catch (e) { pubStatus.className = "rp-status err"; pubStatus.textContent = "JSON 解析失敗：" + e.message; return; }
      pubStatus.textContent = "發布中…";
      try {
        const n = await saveEarnings(calls);
        document.getElementById("jsonInput").value = "";
        if (view) await view.reload();
        pubStatus.className = "rp-status ok";
        pubStatus.textContent = `已發布 ${n} 場會議。`;
      } catch (e) {
        pubStatus.className = "rp-status err";
        pubStatus.textContent = "發布失敗：" + (e.code === "permission-denied" ? "帳號不在白名單，無寫入權限。" : e.message);
      }
    });
  </script>
</body>
</html>
