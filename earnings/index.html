<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>財報電話會議分析 · Earnings Calls</title>
  <link rel="stylesheet" href="../css/style.css?v=20260806e" />
  <link rel="stylesheet" href="../css/reports.css?v=20260904a" />
  <link rel="stylesheet" href="../css/facts.css?v=20260831a" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Sans+TC:wght@300;400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
</head>
<body>
  <div id="siteSidebar"></div>

  <main class="main-content">
    <div class="rp-head">
      <h2 class="page-title">財報電話會議分析</h2>
      <div class="rp-head-links">
        <a class="rp-skill-link" href="../facts/index.html" title="前往事實追蹤頁面">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
          <span>事實追蹤</span>
        </a>
        <a class="rp-skill-link" href="https://github.com/hgvf/Skills-zoo/blob/main/Earnings-call" target="_blank" rel="noopener" title="查看產生此頁 JSON 的 LLM Skill">
          <svg viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8Z"/></svg>
          <span>Skill</span>
        </a>
      </div>
    </div>
    <div class="ar-sources">
      <span class="ar-sources-label">財報行事曆</span>
      <a class="ar-src" href="https://finmoconf.diveinvest.net/" target="_blank" rel="noopener">
        <span class="ar-src-mk">台股</span><span class="ar-src-nm">FinMo</span></a>
      <a class="ar-src" href="https://earningshub.com/earnings-list/this-week" target="_blank" rel="noopener">
        <span class="ar-src-mk">美股</span><span class="ar-src-nm">EarningsHub</span></a>
      <a class="ar-src" href="https://tradingeconomics.com/japan/earnings" target="_blank" rel="noopener">
        <span class="ar-src-mk">日股</span><span class="ar-src-nm">TradingEconomics</span></a>
      <a class="ar-src" href="https://tradingeconomics.com/south-korea/earnings" target="_blank" rel="noopener">
        <span class="ar-src-mk">韓股</span><span class="ar-src-nm">TradingEconomics</span></a>
    </div>

    <!-- Admin-only importer (visible only when signed in as a whitelisted user) -->
    <details class="rp-import" id="importPanel" hidden>
      <summary>＋ 匯入 / 更新財報 JSON</summary>
      <p class="rp-hint">貼上 claude.ai Project 產生的 JSON —— 接受 <code>{"calls":[...]}</code>、陣列、或單一 call 物件。發布後自動刷新，資料存於 Firebase。</p>
      <textarea id="jsonInput" class="rp-textarea" spellcheck="false"
        placeholder='{"calls":[{"ticker":"NVDA","company":"NVIDIA Corp","year":2026,"quarter":"Q2","date":"2026-05-28","summary":"...","highlights":[{"text":"...","sentiment":"bullish"}]}]}'></textarea>
      <div class="rp-import-actions">
        <button id="publishBtn" class="rp-btn">發布到 Firebase</button>
        <span id="pubStatus" class="rp-status"></span>
      </div>
    </details>

    <div id="reportRoot" class="rv-root"></div>

    <!-- Single-company last-4-quarters comparison -->
    <section class="ec-compare" id="compare" hidden>
      <div class="ec-compare-head">
        <h3 class="ec-compare-title">近四季比較</h3>
        <label class="rv-ctl">公司 <span class="rv-sel-wrap"><select class="rv-select" id="cmpTicker"></select></span></label>
      </div>
      <div class="ec-compare-row" id="compareRow"></div>
    </section>

  </main>

  <script type="module">
    import { mountSidebar } from "../js/sidebar.js";
    import { mountReportView } from "../js/reportview.js";
    import { sent, esc, fmtDate, chartUrl, onAuth, parseCalls, saveEarnings, updateEarningsCall, loadPricesMap, loadOverridesMap, setTickerAdmin, tickerTrendCard } from "../js/reports.js";
    import { factId, isFactTracked, hasFactsForTicker, toggleFactBookmark, onFactsChange } from "../js/facts.js";

    mountSidebar("earnings");
    // Warm the prices snapshot + name overrides so the per-call trend table is ready on click.
    loadPricesMap();
    loadOverridesMap();

    // Overall = bullish only if bullish count exceeds bearish + neutral combined
    // (and symmetrically for bearish); otherwise neutral.
    function overall(c) {
      let b = 0, r = 0, n = 0;
      (c.highlights || []).forEach(h => {
        if (h.sentiment === "bullish") b++;
        else if (h.sentiment === "bearish") r++;
        else n++;
      });
      if (b > r + n) return "bullish";
      if (r > b + n) return "bearish";
      return "neutral";
    }
    // Bookmark ("收藏") toggle rendered next to each highlight / watch point.
    function fbmBtn(kind, idx, tracked) {
      return `<button class="ec-fbm${tracked ? " on" : ""}" data-fact-toggle data-kind="${kind}" data-idx="${idx}"`
        + ` title="${tracked ? "已收藏至事實追蹤（再按取消）" : "收藏為追蹤事實"}" aria-label="收藏事實">${tracked ? "★" : "☆"}</button>`;
    }
    // `bm` (optional) = { kind, idx, tracked } — when present, appends a bookmark button.
    function hlHTML(h, bm) {
      const hs = sent(h.sentiment);
      const icon = h.sentiment === "bullish" ? "▲" : h.sentiment === "bearish" ? "▼" : "—";
      const btn = bm ? fbmBtn(bm.kind, bm.idx, bm.tracked) : "";
      return `<div class="ec-hl ${hs.cls}"><span class="sent-tag ${hs.cls}">${icon}</span><span class="ec-hl-tx">${esc(h.text)}</span>${btn}</div>`;
    }
    // Link next to K線 → the ticker's fact-tracking page. Dimmed (non-clickable)
    // until at least one fact/watch point for this ticker has been bookmarked.
    function factLinkHTML(c) {
      const has = hasFactsForTicker(c.ticker);
      return `<a class="ec-kbtn ec-factlink${has ? "" : " disabled"}" data-factlink data-tk="${esc(c.ticker)}"`
        + (has
            ? ` href="../facts/index.html?ticker=${encodeURIComponent(c.ticker)}" title="查看 ${esc(c.ticker)} 事實追蹤"`
            : ` href="#" aria-disabled="true" tabindex="-1" title="尚無追蹤事實 — 先收藏下方事實 / 看點"`)
        + `>📌 事實追蹤</a>`;
    }
    let currentCall = null;
    let editing = false;               // whether the detail panel is in edit mode
    function detail(c) {
      currentCall = c;
      if (editing && lastAdmin) return detailEdit(c);
      const s = sent(overall(c));
      const hls = (c.highlights || []).map((h, i) =>
        hlHTML(h, { kind: "fact", idx: i, tracked: isFactTracked(factId(c.ticker, "fact", h.text)) })).join("");
      const watch = (c.watch || []).filter(w => w);
      const watchCard = watch.length
        ? `<div class="rp-subcard ec-watch"><div class="rp-subcard-head">🔮 未來重點看點</div>
            <ul class="ec-watch-list">${watch.map((w, i) =>
              `<li><span class="ec-watch-tx">${esc(w)}</span>${fbmBtn("watch", i, isFactTracked(factId(c.ticker, "watch", w)))}</li>`).join("")}</ul></div>`
        : "";
      const editBtn = lastAdmin
        ? `<button class="ec-editbtn" data-ec-edit title="編輯此財報卡（新增／刪除 節點與未來重點）">✎ 編輯</button>` : "";
      return `<article class="rv-detail ${s.cls}">
        <div class="ec-head">
          <span class="ec-ticker">${esc(c.ticker)}</span>
          <span class="ec-company">${esc(c.company || "")}</span>
          <a class="ec-kbtn" href="${esc(chartUrl(c.ticker))}" target="_blank" rel="noopener" title="在 TradingView 看 ${esc(c.ticker)} 線圖">📈 K線</a>
          ${factLinkHTML(c)}
          ${editBtn}
          <span class="ec-qtr">${esc(c.year)} ${esc(c.quarter)}${c.date ? " · " + esc(fmtDate(c.date)) : ""}</span>
        </div>
        ${c.summary ? `<p class="ec-summary">${esc(c.summary)}</p>` : ""}
        ${hls ? `<div class="ec-hls">${hls}</div>` : ""}
        ${watchCard}
        ${tickerTrendCard([c.ticker])}
      </article>`;
    }

    // ── Inline editor ────────────────────────────────────────────────────
    // Order matters: cycling a node's sentiment steps through this list.
    const SENT_CYCLE = ["bullish", "bearish", "neutral"];
    const sentIcon = s => (s === "bullish" ? "▲" : s === "bearish" ? "▼" : "—");
    // One editable highlight row: sentiment-cycle button + text input + delete.
    function editHlRow(h = { text: "", sentiment: "neutral" }) {
      const s = sent(h.sentiment);
      return `<div class="ec-ed-row" data-ec-hlrow data-sent="${esc(h.sentiment)}">
        <button class="ec-ed-sent sent-tag ${s.cls}" data-ec-cyclesent title="切換 偏多 / 偏空 / 中性">${sentIcon(h.sentiment)}</button>
        <input class="ec-ed-input" data-ec-hltext type="text" value="${esc(h.text)}" placeholder="輸入重點節點內容…" />
        <button class="ec-ed-del" data-ec-delrow title="刪除此節點" aria-label="刪除">✕</button>
      </div>`;
    }
    // One editable future-watch row: text input + delete.
    function editWatchRow(w = "") {
      return `<div class="ec-ed-row" data-ec-watchrow>
        <span class="ec-ed-bullet">▸</span>
        <input class="ec-ed-input" data-ec-watchtext type="text" value="${esc(w)}" placeholder="輸入未來重點事項…" />
        <button class="ec-ed-del" data-ec-delrow title="刪除此項" aria-label="刪除">✕</button>
      </div>`;
    }
    function detailEdit(c) {
      const hlRows = (c.highlights || []).map(editHlRow).join("");
      const watchRows = (c.watch || []).filter(w => w).map(editWatchRow).join("");
      return `<article class="rv-detail ec-editing">
        <div class="ec-head">
          <span class="ec-ticker">${esc(c.ticker)}</span>
          <span class="ec-company">${esc(c.company || "")}</span>
          <span class="ec-editing-tag">編輯中</span>
          <span class="ec-qtr">${esc(c.year)} ${esc(c.quarter)}${c.date ? " · " + esc(fmtDate(c.date)) : ""}</span>
        </div>
        <label class="ec-ed-label">摘要</label>
        <textarea class="ec-ed-summary" data-ec-summary rows="2" placeholder="一句話總結本次財報電話會議…">${esc(c.summary || "")}</textarea>

        <label class="ec-ed-label">重點節點（偏多 / 偏空 / 中性）</label>
        <div class="ec-ed-list" data-ec-hllist>${hlRows}</div>
        <button class="rp-btn ghost ec-ed-add" data-ec-addhl>＋ 新增節點</button>

        <label class="ec-ed-label">🔮 未來重點事項</label>
        <div class="ec-ed-list" data-ec-watchlist>${watchRows}</div>
        <button class="rp-btn ghost ec-ed-add" data-ec-addwatch>＋ 新增未來重點</button>

        <div class="ec-ed-actions">
          <button class="rp-btn" data-ec-save>💾 儲存</button>
          <button class="rp-btn ghost" data-ec-cancel>取消</button>
          <span class="rp-status" data-ec-status></span>
        </div>
      </article>`;
    }

    // ── Last-4-quarters comparison section ──────────────────────────────
    const compareSec = document.getElementById("compare");
    const cmpSel = document.getElementById("cmpTicker");
    const cmpRow = document.getElementById("compareRow");
    let cmpAll = [], cmpTicker = null;

    function cmpCard(c) {
      const s = sent(overall(c));
      const hls = (c.highlights || []).map(hlHTML).join("");
      const watch = (c.watch || []).filter(w => w);
      const watchCard = watch.length
        ? `<div class="ec-cmp-watch"><div class="ec-cmp-watch-h">🔮 未來看點</div><ul class="ec-watch-list">${watch.map(w => `<li>${esc(w)}</li>`).join("")}</ul></div>`
        : "";
      return `<div class="ec-cmp-card ${s.cls}">
        <div class="ec-cmp-top">
          <span class="ec-cmp-fy">${esc(c.year)} ${esc(c.quarter)}</span>
          <span class="ec-cmp-date">${c.date ? esc(fmtDate(c.date)) : ""}</span>
        </div>
        ${c.summary ? `<p class="ec-cmp-summary">${esc(c.summary)}</p>` : ""}
        ${hls ? `<div class="ec-hls">${hls}</div>` : ""}
        ${watchCard}
      </div>`;
    }

    function renderCompare() {
      if (!cmpTicker) { cmpRow.innerHTML = ""; return; }
      const calls = cmpAll.filter(c => c.ticker === cmpTicker)
        .sort((a, b) => String(a.date || "").localeCompare(String(b.date || "")));
      const last4 = calls.slice(-4); // most recent 4, chronological (old → new)
      if (!last4.length) { cmpRow.innerHTML = `<div class="rv-empty">此公司尚無會議紀錄。</div>`; return; }
      cmpRow.innerHTML = last4.map(cmpCard).join('<div class="ec-cmp-arrow">→</div>');
    }

    function onEarningsData(calls) {
      cmpAll = calls;
      const tickers = [...new Set(calls.map(c => c.ticker).filter(Boolean))].sort();
      compareSec.hidden = tickers.length === 0;
      if (!tickers.includes(cmpTicker)) cmpTicker = tickers[0] || null;
      cmpSel.innerHTML = tickers.map(t => `<option value="${esc(t)}">${esc(t)}</option>`).join("");
      if (cmpTicker) cmpSel.value = cmpTicker;
      renderCompare();
    }
    cmpSel.addEventListener("change", () => { cmpTicker = cmpSel.value; renderCompare(); });

    let view;
    mountReportView({
      root: document.getElementById("reportRoot"),
      collection: "earnings_calls",
      tickersOf: c => (c.ticker ? [c.ticker] : []),
      sentimentOf: overall,
      nodeTitle: c => `${c.ticker} ${c.year} ${c.quarter}`,
      chipLabel: c => c.ticker,
      renderDetail: detail,
      emptyHint: "點選左側會議節點，重點會顯示在這裡",
      onData: onEarningsData,
    }).then(v => { view = v; view.setAdmin(lastAdmin); }).catch(e => { console.error(e); });

    // ── Fact-tracking bookmarks (收藏) on the detail panel ────────────────
    const reportRoot = document.getElementById("reportRoot");
    function updateFactLink(c) {
      const link = reportRoot.querySelector("[data-factlink]");
      if (link) link.outerHTML = factLinkHTML(c);
    }
    reportRoot.addEventListener("click", e => {
      const disabledLink = e.target.closest(".ec-factlink.disabled");
      if (disabledLink) { e.preventDefault(); return; }
      const b = e.target.closest("[data-fact-toggle]");
      if (!b || !currentCall) return;
      const c = currentCall;
      const kind = b.dataset.kind, idx = parseInt(b.dataset.idx, 10);
      let text = "", sentiment = "";
      if (kind === "watch") { text = (c.watch || []).filter(w => w)[idx]; }
      else { const h = (c.highlights || [])[idx]; if (h) { text = h.text; sentiment = h.sentiment; } }
      if (!text) return;
      const now = toggleFactBookmark({
        ticker: c.ticker, company: c.company || c.ticker, kind, title: text,
        source: { quarter: `${c.year} ${c.quarter}`, date: c.date || "", sentiment: sentiment || "" },
      });
      b.classList.toggle("on", now);
      b.textContent = now ? "★" : "☆";
      b.title = now ? "已收藏至事實追蹤（再按取消）" : "收藏為追蹤事實";
      updateFactLink(c);
    });
    // Reflect store changes made elsewhere (other tabs / the facts page).
    onFactsChange(() => {
      if (!currentCall) return;
      const c = currentCall;
      reportRoot.querySelectorAll("[data-fact-toggle]").forEach(b => {
        const kind = b.dataset.kind, idx = parseInt(b.dataset.idx, 10);
        let text = "";
        if (kind === "watch") text = (c.watch || []).filter(w => w)[idx];
        else { const h = (c.highlights || [])[idx]; if (h) text = h.text; }
        if (!text) return;
        const on = isFactTracked(factId(c.ticker, kind, text));
        b.classList.toggle("on", on);
        b.textContent = on ? "★" : "☆";
      });
      updateFactLink(c);
    });

    // ── Inline editor wiring (admin only) ────────────────────────────────
    function reRenderDetail() {
      if (currentCall) reportRoot.querySelector(".rv-right").innerHTML = detail(currentCall);
    }
    reportRoot.addEventListener("click", async e => {
      // Enter edit mode
      if (e.target.closest("[data-ec-edit]")) { editing = true; reRenderDetail(); return; }
      // Cancel — drop unsaved changes, return to read view
      if (e.target.closest("[data-ec-cancel]")) { editing = false; reRenderDetail(); return; }
      // Cycle a node's sentiment (偏多 → 偏空 → 中性)
      const cyc = e.target.closest("[data-ec-cyclesent]");
      if (cyc) {
        const row = cyc.closest("[data-ec-hlrow]");
        const cur = row.dataset.sent || "neutral";
        const next = SENT_CYCLE[(SENT_CYCLE.indexOf(cur) + 1) % SENT_CYCLE.length];
        row.dataset.sent = next;
        const s = sent(next);
        cyc.className = `ec-ed-sent sent-tag ${s.cls}`;
        cyc.textContent = sentIcon(next);
        return;
      }
      // Add a blank node / watch row
      if (e.target.closest("[data-ec-addhl]")) {
        reportRoot.querySelector("[data-ec-hllist]").insertAdjacentHTML("beforeend", editHlRow());
        return;
      }
      if (e.target.closest("[data-ec-addwatch]")) {
        reportRoot.querySelector("[data-ec-watchlist]").insertAdjacentHTML("beforeend", editWatchRow());
        return;
      }
      // Delete a row
      const del = e.target.closest("[data-ec-delrow]");
      if (del) { del.closest("[data-ec-hlrow], [data-ec-watchrow]").remove(); return; }
      // Save — collect the form and patch Firebase
      if (e.target.closest("[data-ec-save]")) {
        if (!currentCall) return;
        const status = reportRoot.querySelector("[data-ec-status]");
        const summary = reportRoot.querySelector("[data-ec-summary]").value.trim();
        const highlights = [...reportRoot.querySelectorAll("[data-ec-hlrow]")].map(r => ({
          text: r.querySelector("[data-ec-hltext]").value,
          sentiment: r.dataset.sent || "neutral",
        })).filter(h => h.text.trim());
        const watch = [...reportRoot.querySelectorAll("[data-ec-watchtext]")]
          .map(i => i.value).filter(w => w.trim());
        status.className = "rp-status"; status.textContent = "儲存中…";
        try {
          await updateEarningsCall(currentCall.id, { summary, highlights, watch });
          editing = false;
          if (view) await view.reload();   // reload refreshes the timeline + detail from Firebase
        } catch (err) {
          status.className = "rp-status err";
          status.textContent = "儲存失敗：" + (err.code === "permission-denied" ? "需以白名單管理員登入。" : err.message);
        }
        return;
      }
    });

    // Admin importer + delete (sign-in handled in the sidebar)
    const importPanel = document.getElementById("importPanel");
    const pubStatus = document.getElementById("pubStatus");
    let lastAdmin = false;
    onAuth(({ isAdmin }) => {
      lastAdmin = isAdmin; importPanel.hidden = !isAdmin; setTickerAdmin(isAdmin);
      if (view) view.setAdmin(isAdmin);
      // Leaving admin (or the edit button appearing on sign-in) → refresh the open card.
      if (!isAdmin && editing) editing = false;
      reRenderDetail();
    });

    document.getElementById("publishBtn").addEventListener("click", async () => {
      const raw = document.getElementById("jsonInput").value.trim();
      pubStatus.className = "rp-status";
      if (!raw) { pubStatus.textContent = "請先貼上 JSON。"; return; }
      let calls;
      try { calls = parseCalls(raw); }
      catch (e) { pubStatus.className = "rp-status err"; pubStatus.textContent = "JSON 解析失敗：" + e.message; return; }
      pubStatus.textContent = "發布中…";
      try {
        const n = await saveEarnings(calls);
        document.getElementById("jsonInput").value = "";
        if (view) await view.reload();
        pubStatus.className = "rp-status ok";
        pubStatus.textContent = `已發布 ${n} 場會議。`;
      } catch (e) {
        pubStatus.className = "rp-status err";
        pubStatus.textContent = "發布失敗：" + (e.code === "permission-denied" ? "帳號不在白名單，無寫入權限。" : e.message);
      }
    });
  </script>
</body>
</html>
