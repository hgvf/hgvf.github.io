<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>年報重點 · Annual Report Highlights</title>
  <link rel="stylesheet" href="../css/style.css?v=20260806" />
  <link rel="stylesheet" href="../css/reports.css?v=20260827a" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Sans+TC:wght@300;400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
</head>
<body>
  <div id="siteSidebar"></div>

  <main class="main-content">
    <div class="rp-head">
      <h2 class="page-title">年報重點</h2>
      <a class="rp-skill-link" href="https://github.com/hgvf/Skills-zoo/blob/main/annual-report-reading" target="_blank" rel="noopener" title="查看產生此頁 JSON 的 LLM Skill">
        <svg viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8Z"/></svg>
        <span>Skill</span>
      </a>
    </div>
    <div class="ar-sources">
      <span class="ar-sources-label">年報來源</span>
      <a class="ar-src" href="https://mops.twse.com.tw/mops/#/web/t57sb01_q1" target="_blank" rel="noopener">
        <span class="ar-src-mk">台股</span><span class="ar-src-nm">MOPS</span>
        <span class="ar-src-path">財務報告書 → 查詢股東會年報 → 股東會年報</span></a>
      <a class="ar-src" href="https://www.sec.gov/edgar/search/" target="_blank" rel="noopener">
        <span class="ar-src-mk">美股</span><span class="ar-src-nm">SEC EDGAR</span>
        <span class="ar-src-path">10-K</span></a>
      <a class="ar-src" href="https://disclosure2.edinet-fsa.go.jp/WEEK0010.aspx" target="_blank" rel="noopener">
        <span class="ar-src-mk">日股</span><span class="ar-src-nm">EDINET</span>
        <span class="ar-src-path">有価証券報告書</span></a>
      <a class="ar-src" href="https://dart.fss.or.kr/" target="_blank" rel="noopener">
        <span class="ar-src-mk">韓股</span><span class="ar-src-nm">DART</span>
        <span class="ar-src-path">商業報告書</span></a>
    </div>

    <!-- Admin-only importer (visible only when signed in as a whitelisted user) -->
    <details class="rp-import" id="importPanel" hidden>
      <summary>＋ 匯入 / 更新年報 JSON</summary>
      <p class="rp-hint">貼上 <code>annual_report_summary</code> schema 的 JSON —— 接受 <code>{"reports":[...]}</code>、陣列、或單一年報物件。以 <code>ticker</code>（或公司名）+ <code>fiscal_year</code> 為主鍵，重覆匯入會覆蓋更新。發布後自動刷新，資料存於 Firebase。</p>
      <textarea id="jsonInput" class="rp-textarea" spellcheck="false"
        placeholder='{"schema_version":"annual_report_summary_v2","document":{"market":"TW","fiscal_year":"2024",...},"company":{"name":"...","ticker":"..."},"headline":{"stance":"slightly_bullish",...}, ...}'></textarea>
      <div class="rp-import-actions">
        <button id="publishBtn" class="rp-btn">發布到 Firebase</button>
        <span id="pubStatus" class="rp-status"></span>
      </div>
    </details>

    <div id="reportRoot" class="ar-root"></div>

    <!-- Single-company multi-year comparison -->
    <section class="ar-compare" id="compare" hidden>
      <div class="ar-compare-head">
        <h3 class="ar-compare-title">單一公司 · 多年度比較</h3>
        <label class="rv-ctl">公司 <span class="rv-sel-wrap"><select class="rv-select" id="cmpCompany"></select></span></label>
      </div>
      <div class="ar-compare-row" id="compareRow"></div>
    </section>

  </main>

  <script type="module">
    import { mountSidebar } from "../js/sidebar.js";
    import { mountAnnualView } from "../js/annualview.js?v=20260806d";
    import { onAuth, parseAnnualReports, saveAnnualReports } from "../js/reports.js";

    mountSidebar("annual-report");

    const compareSec = document.getElementById("compare");

    let view = null, lastAdmin = false;
    mountAnnualView({
      root: document.getElementById("reportRoot"),
      compareRoot: document.getElementById("compareRow"),
      compareSelect: document.getElementById("cmpCompany"),
      onData: reports => {
        const companies = new Set(reports.map(r => r._ticker || r._company).filter(Boolean));
        compareSec.hidden = companies.size === 0;
      },
    }).then(v => { view = v; view.setAdmin(lastAdmin); })
      .catch(e => { console.error(e); document.getElementById("reportRoot").innerHTML = '<div class="rv-empty">載入失敗，請稍後再試。</div>'; });

    // Admin importer + delete (sign-in handled in the sidebar)
    const importPanel = document.getElementById("importPanel");
    const pubStatus = document.getElementById("pubStatus");
    onAuth(({ isAdmin }) => { lastAdmin = isAdmin; importPanel.hidden = !isAdmin; if (view) view.setAdmin(isAdmin); });

    document.getElementById("publishBtn").addEventListener("click", async () => {
      const raw = document.getElementById("jsonInput").value.trim();
      pubStatus.className = "rp-status";
      if (!raw) { pubStatus.textContent = "請先貼上 JSON。"; return; }
      let reports;
      try { reports = parseAnnualReports(raw); }
      catch (e) { pubStatus.className = "rp-status err"; pubStatus.textContent = "JSON 解析失敗：" + e.message; return; }
      pubStatus.textContent = "發布中…";
      try {
        const n = await saveAnnualReports(reports);
        document.getElementById("jsonInput").value = "";
        if (view) await view.reload();
        pubStatus.className = "rp-status ok";
        pubStatus.textContent = `已發布 ${n} 份年報。`;
      } catch (e) {
        pubStatus.className = "rp-status err";
        pubStatus.textContent = "發布失敗：" + (e.code === "permission-denied" ? "帳號不在白名單，無寫入權限。" : e.message);
      }
    });
  </script>
</body>
</html>
