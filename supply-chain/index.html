<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>供應鏈瓶頸新聞 · Supply Chain Digest</title>
  <link rel="stylesheet" href="../css/style.css" />
  <link rel="stylesheet" href="../css/reports.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Sans+TC:wght@300;400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
</head>
<body>
  <div id="siteSidebar"></div>

  <main class="main-content">
    <div class="rp-head">
      <h2 class="page-title">供應鏈瓶頸新聞</h2>
    </div>
    <p class="rp-sub">每日由 Claude 自動彙整的供應鏈瓶頸、缺料、航運壅塞重點。點左側節點，內容顯示在右側。</p>

    <div id="reportRoot" class="rv-root"></div>
    <p class="rp-foot">資料由 Claude 自動彙整並存於 Firebase，僅供參考，非投資建議。</p>
  </main>

  <script type="module">
    import { mountSidebar } from "../js/sidebar.js";
    import { mountReportView } from "../js/reportview.js";
    import { sent, esc, fmtDate } from "../js/reports.js";

    mountSidebar("supply-chain");

    function detail(it) {
      const s = sent(it.sentiment);
      const tickers = (it.tickers || []).map(t => `<span class="rp-ticker">${esc(t)}</span>`).join("");
      const sources = (it.sources || []).length
        ? `<div class="news-src">來源：${it.sources.map(o => `<a href="${esc(o.url)}" target="_blank" rel="noopener">${esc(o.title || o.url)}</a>`).join("")}</div>`
        : "";
      return `<article class="rv-detail ${s.cls}">
        <div class="rv-detail-meta">
          <span class="rp-date">${esc(fmtDate(it.date))}</span>
          ${tickers}
          <span class="sent-tag ${s.cls}">${s.label}</span>
        </div>
        <h2 class="rv-detail-title">${esc(it.headline)}</h2>
        <p class="rv-detail-body">${esc(it.content)}</p>
        ${sources}
      </article>`;
    }

    mountReportView({
      root: document.getElementById("reportRoot"),
      collection: "supply_chain_news",
      tickersOf: it => it.tickers || [],
      sentimentOf: it => it.sentiment || "neutral",
      nodeTitle: it => it.headline,
      chipLabel: it => (it.tickers && it.tickers[0]) || "•",
      renderDetail: detail,
      emptyHint: "點選左側新聞節點，內容會顯示在這裡",
    }).catch(e => { console.error(e); document.getElementById("reportRoot").innerHTML = '<div class="rv-empty">載入失敗，請稍後再試。</div>'; });
  </script>
</body>
</html>
