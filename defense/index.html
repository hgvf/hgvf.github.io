<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>每日軍武合約 · Defense Contracts</title>
  <link rel="stylesheet" href="../css/style.css?v=20260806e" />
  <link rel="stylesheet" href="../css/reports.css?v=20260827a" />
  <link rel="stylesheet" href="../css/defense.css?v=20260828a" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Sans+TC:wght@300;400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
</head>
<body>
  <div id="siteSidebar"></div>

  <main class="main-content">
    <div class="rp-head">
      <h2 class="page-title">每日軍武合約</h2>
      <a class="rp-skill-link" href="https://github.com/hgvf/Skills-zoo/tree/main/military-contract" target="_blank" rel="noopener" title="查看產生此頁 JSON 的 LLM Skill">
        <svg viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8Z"/></svg>
        <span>Skill</span>
      </a>
    </div>
    <p class="df-sub">各國官方採購與合約公告（DoD / ATLA / DAPA / MND 等）。保留合約編號、金額與官方來源連結；承包商標註對應上市股票。</p>

    <!-- Admin-only importer (visible only when signed in as a whitelisted user) -->
    <details class="rp-import" id="importPanel" hidden>
      <summary>＋ 匯入 / 更新每日軍武 JSON（ADD JSON）</summary>
      <p class="rp-hint">貼上 <code>military-contract</code> skill 產出的 JSON —— 接受 <code>{"run":{…},"events":[…]}</code>、事件陣列、或單一 event。以 <code>event_id</code> 為主鍵，重貼同 id 會覆蓋。資料寫入 Firebase <code>mil_defense_daily</code>。</p>
      <textarea id="jsonInput" class="rp-textarea" spellcheck="false"
        placeholder='{"run":{"run_date":"2026-08-18"},"events":[{"event_id":"...","country":"US","title":"...","title_zh":"...","summary_zh":"...","contract":{"amount":169216659,"currency":"USD"},"sources":[{"url":"https://..."}]}]}'></textarea>
      <div class="rp-import-actions">
        <button id="publishBtn" class="rp-btn">發布到 Firebase</button>
        <span id="pubStatus" class="rp-status"></span>
      </div>
    </details>

    <div id="app"><p class="df-meta">載入中…</p></div>
  </main>

  <script type="module">
    import { mountSidebar } from "../js/sidebar.js";
    import { wireImporter } from "../js/defenseview.js";
    mountSidebar("defense");
    wireImporter();
  </script>
</body>
</html>
