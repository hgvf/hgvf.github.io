<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>產業消息 · Supply Chain Intelligence Daily</title>
  <link rel="stylesheet" href="../css/style.css?v=20260824b" />
  <link rel="stylesheet" href="../css/reports.css?v=20260826a" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Sans+TC:wght@300;400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
</head>
<body>
  <div id="siteSidebar"></div>

  <main class="main-content">
    <div class="rp-head">
      <h2 class="page-title">產業消息</h2>
      <a class="rp-skill-link" href="https://github.com/hgvf/Skills-zoo/blob/main/supply-chain-intelligence-daily" target="_blank" rel="noopener" title="查看產生此頁 JSON 的 LLM Skill">
        <svg viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8Z"/></svg>
        <span>Skill</span>
      </a>
    </div>

    <div id="reportRoot" class="rv-root in-root"></div>
  </main>

  <script type="module">
    import { mountSidebar } from "../js/sidebar.js";
    import { mountIndustryView } from "../js/industryview.js";
    import { detail } from "../js/industrydetail.js";
    import { toggleCollected, isCollected, onCollectChange } from "../js/collect.js";
    import { onAuth, loadPricesMap } from "../js/reports.js";
    loadPricesMap();  // warm the prices snapshot for the per-item trend table

    mountSidebar("industry-news");

    let view = null, lastAdmin = false;
    onAuth(({ isAdmin }) => { lastAdmin = isAdmin; if (view) view.setAdmin(isAdmin); });

    mountIndustryView({
      root: document.getElementById("reportRoot"),
      collection: "supply_chain_events",
      renderDetail: detail,
      emptyHint: "點選左側事件節點，內容會顯示在這裡",
      isCollected,
      onCollect: (ev) => toggleCollected(ev, "industry-news"),  // → 重點新聞 page
    }).then(v => { view = v; view.setAdmin(lastAdmin); })
      .catch(e => { console.error(e); document.getElementById("reportRoot").innerHTML = '<div class="rv-empty">載入失敗，請稍後再試。</div>'; });

    // Keep the collect (bookmark) icons in sync when items are removed elsewhere.
    onCollectChange(() => { if (view) view.refreshCollectStates(); });
  </script>
</body>
</html>
